[package]
name = "thuum"
version = "0.1.0"
edition = "2024"
publish = false

[features]
probe = []
test-hook = []

[[bin]]
name = "thuum-probe"
path = "src/bin/thuum-probe.rs"
required-features = ["probe"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
tract-onnx = "=0.22.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dev.package."*"]
opt-level = 3
